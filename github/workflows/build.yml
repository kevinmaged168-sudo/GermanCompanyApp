name: Build GermanCompanyApp APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o GermanCompanyApp_Android_Project.zip -d project

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GermanCompanyApp-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
